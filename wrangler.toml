# Cloudflare Worker + Static Assets.
# `wrangler deploy` runs the Vite build (see [build]) and uploads ./dist as static
# assets. The Worker runs first for every request: the 3D viewer is password protected
# (set it with `npx wrangler secret put VIEWER_PASSWORD`); the 2D parts atlas is public.
name = "k1000real"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[build]
command = "npm run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

[vars]
# Websites allowed to embed the viewer and the parts atlas (iframe / embed.js). Every other site is refused.
EMBED_ORIGINS = "https://www.khaero.com https://khaero.com"
